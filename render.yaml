databases:
  - name: terarpeqa-db
    databaseName: terarpeqa
    plan: free

services:
  - type: web
    name: terarpeqa
    runtime: node
    plan: free
    # --include=dev garante o Vite e o Tailwind mesmo com NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terarpeqa-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
